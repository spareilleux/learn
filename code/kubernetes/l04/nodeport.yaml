# Lesson 4: the C# API on port 30080 of every node. kind/cluster.yaml maps that port to localhost:30080.
apiVersion: v1
kind: Service
metadata:
  name: csharp-api-nodeport
spec:
  type: NodePort
  selector:
    app: csharp-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
