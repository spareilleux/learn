# Lesson 4: a LoadBalancer Service. In a cloud, the provider creates a load balancer; on kind, cloud-provider-kind does.
apiVersion: v1
kind: Service
metadata:
  name: java-reactor-api-lb
spec:
  type: LoadBalancer
  selector:
    app: java-reactor-api
  ports:
    - name: http
      port: 80
      targetPort: http
