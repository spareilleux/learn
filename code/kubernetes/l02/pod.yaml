# Lesson 2: one pod running the C# API built in the WSL containers course, with requests, limits and two probes.
apiVersion: v1
kind: Pod
metadata:
  name: csharp-api
  labels:
    app: csharp-api
spec:
  containers:
    - name: api
      image: csharp-api:1.0
      # kind loads the image into the node: never try a registry
      imagePullPolicy: Never
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          memory: 256Mi
      # Send traffic only once GET / answers
      readinessProbe:
        httpGet:
          path: /
          port: 8080
        periodSeconds: 5
      # Restart the container if GET / stops answering
      livenessProbe:
        httpGet:
          path: /
          port: 8080
        periodSeconds: 10
        failureThreshold: 3
