# Lesson 2: the three QoS classes, decided by requests and limits alone.
apiVersion: v1
kind: Pod
metadata:
  name: guaranteed
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      # Requests equal to limits, for CPU and memory, in every container
      resources:
        requests: { cpu: 50m, memory: 32Mi }
        limits: { cpu: 50m, memory: 32Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: burstable
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      # At least one request or limit, but not Guaranteed
      resources:
        requests: { memory: 16Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: besteffort
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
