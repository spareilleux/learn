<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chord Explorer</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <h1>Chord Explorer <small class="muted">Vite + TypeScript</small></h1>

      <section>
        <h2>Spell a chord</h2>
        <form id="chord-form">
          <input id="chord-input" value="Bbm7" autocomplete="off" spellcheck="false" />
          <button type="submit">Spell</button>
          <button type="button" id="down">−1</button>
          <button type="button" id="up">+1</button>
          <button type="button" id="favorite">☆ Favorite</button>
        </form>
        <p id="qualities" class="muted"></p>
        <p id="chord-output" class="output"></p>
        <p id="chord-error" class="error"></p>
      </section>

      <section>
        <h2>Chords of a key</h2>
        <form id="key-form">
          <input id="tonic-input" value="Eb" autocomplete="off" spellcheck="false" />
          <select id="mode-select">
            <option value="major">major</option>
            <option value="minor">minor</option>
          </select>
          <button type="submit">Show</button>
        </form>
        <div id="key-chords" class="chips"></div>
      </section>

      <section>
        <h2>Favorites</h2>
        <div id="favorites" class="chips"><span class="muted">none yet</span></div>
        <p>
          <button type="button" id="export">Export…</button>
          <span id="export-status" class="output"></span>
        </p>
      </section>

      <section>
        <h2>Voicings in standard tuning</h2>
        <form id="search-form">
          <label>
            max span
            <select id="span-select">
              <option>2</option>
              <option selected>3</option>
              <option>4</option>
            </select>
          </label>
          <button type="submit" id="search">Search</button>
          <button type="button" id="cancel" disabled>Cancel</button>
        </form>
        <progress id="progress" max="1" value="0"></progress>
        <p id="search-status" class="output"></p>
        <ol id="voicings" class="voicings"></ol>
      </section>
    </main>
  </body>
</html>
