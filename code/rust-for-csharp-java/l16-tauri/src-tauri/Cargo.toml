[package]
name = "chord-explorer"
version = "0.1.0"
edition = "2024"
publish = false
description = "A desktop chord explorer: a Tauri window over the theory crate"

[lib]
# The _lib suffix avoids a name clash between the library and the binary on Windows
name = "chord_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
theory = { path = "../theory" }
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
# The mock runtime: call commands through the real IPC layer, without a window
tauri = { version = "2.11.5", features = ["test"] }
