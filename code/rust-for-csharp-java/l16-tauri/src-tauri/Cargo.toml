[package]
name = "chord-explorer"
version = "0.1.0"
edition = "2024"
publish = false
description = "A desktop chord explorer: a Tauri window over the theory crate"

[lib]
# The _lib suffix avoids a name clash between the library and the binary on Windows
name = "chord_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
theory = { path = "../theory" }
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Lesson 19: TypeScript declarations generated from the Rust types (written by `cargo test`)
ts-rs = "12.0.1"
# Lesson 20: official plugins, each with its own permissions
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-store = "2.4.5"
# Lesson 21: a WebDriver server inside the app, compiled only for end-to-end tests
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }

[features]
# `tauri build --features webdriver` builds the binary that WebdriverIO drives
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
# The mock runtime: call commands through the real IPC layer, without a window
tauri = { version = "2.11.5", features = ["test"] }
