[project]
name = "python-for-csharp-java"
version = "0.1.0"
description = "Examples, error snippets, solutions and tests of the course Python for C#/Java developers"
requires-python = ">=3.14.7"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
]

# The course is a folder of scripts, not a package to install: uv only manages its environment
[tool.uv]
package = false

[tool.mypy]
strict = true
files = ["examples", "solutions", "tests"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["examples", "solutions"]
addopts = ["-p", "no:cacheprovider"]
