name: Internal links resolve

# A link that is wrong in the Markdown still builds, still deploys, and 404s for the reader: the page's
# depth in the URL is not its depth in src/content/docs/ once `base` is applied. So the check runs on the
# built site, and runs against a broken link first, because a check that has never failed is a decoration.

on:
  push:
    branches: [main]
    paths: ['src/content/docs/**', 'src/components/**', 'astro.config.mjs', 'scripts/check-links.py', 'package.json', 'package-lock.json', '.github/workflows/link-check.yml']
  pull_request:
    paths: ['src/content/docs/**', 'src/components/**', 'astro.config.mjs', 'scripts/check-links.py', 'package.json', 'package-lock.json', '.github/workflows/link-check.yml']

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The check must be able to fail
        run: python3 scripts/check-links.py --self-test
      - run: python3 scripts/check-links.py
