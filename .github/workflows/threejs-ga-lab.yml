# three.js course, Guitar Alchemist 3D lab (lesson 14): type-check the experiments, run the unit tests and the data
# scripts, open every experiment's "ci" runs in headless Chromium on WebGL 2 and compare their renderer.info counters and
# checks with ga-lab/expected/, then build the pages, on three OSes. The runners have no GPU: no time is compared, the
# measured runs are made on the author's machine (ga-lab/results/).
name: three.js GA 3D lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['code/threejs/ga-lab/**', 'code/threejs/src/13-fretboard/**', 'code/threejs/src/probe.ts', 'code/threejs/package-lock.json', '.github/workflows/threejs-ga-lab.yml']
  pull_request:
    paths: ['code/threejs/ga-lab/**', 'code/threejs/src/13-fretboard/**', 'code/threejs/src/probe.ts', 'code/threejs/package-lock.json', '.github/workflows/threejs-ga-lab.yml']

permissions:
  contents: read

env:
  NODE_VERSION: 24.21.0

jobs:
  ga-lab:
    name: ga-lab (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: code/threejs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the course's pinned packages (the lab has none of its own)
        run: npm ci
      # On Linux, --with-deps also installs the system libraries that Chromium needs
      - name: Chromium for Playwright
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium chromium-headless-shell
      - name: Types, unit tests, data scripts, counters and build
        run: bash ga-lab/check.sh
      - name: Counter outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: threejs-ga-lab-out-${{ matrix.os }}
          path: code/threejs/ga-lab/out/
          if-no-files-found: ignore
