# C# for beginners: run every example and exercise solution, and compile every rejected snippet,
# on three OSes, and compare the outputs with the expected files
name: C# for beginners examples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['code/csharp-beginner/**', '.github/workflows/csharp-beginner-examples.yml']
  pull_request:
    paths: ['code/csharp-beginner/**', '.github/workflows/csharp-beginner-examples.yml']

permissions:
  contents: read

jobs:
  csharp:
    name: csharp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: code/csharp-beginner/global.json
      - run: bash code/csharp-beginner/check.sh
