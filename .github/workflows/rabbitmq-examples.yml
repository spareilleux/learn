# RabbitMQ course: build the C# and Java examples on three OSes, and run them against a broker on Linux.
# GitHub's Windows and macOS runners have no Docker, so there is no broker to run them against: they only build.
name: RabbitMQ course examples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['code/rabbitmq/**', '.github/workflows/rabbitmq-examples.yml']
  pull_request:
    paths: ['code/rabbitmq/**', '.github/workflows/rabbitmq-examples.yml']

permissions:
  contents: read

jobs:
  run:
    name: run against RabbitMQ (ubuntu-latest)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.3.5-management
        ports:
          - 5672:5672
          - 15672:15672
        # As in broker.sh: a fixed node name (rabbit@rabbitmq), the rabbitmq user so that the health check's CLI
        # can't create the Erlang cookie as root, and a health check so that the job starts once the broker accepts connections
        options: >-
          --hostname rabbitmq
          --user rabbitmq
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    defaults:
      run:
        shell: bash
        working-directory: code/rabbitmq
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: code/rabbitmq/java/**/pom.xml
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: code/rabbitmq/global.json
      - name: Toolchain
        run: java --version && mvn --version && dotnet --version
      - name: Build, run and compare with expected/
        env:
          BROKER_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: bash check.sh
      - name: Broker log
        if: failure()
        run: docker logs --tail 200 ${{ job.services.rabbitmq.id }}

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: code/rabbitmq
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: code/rabbitmq/java/**/pom.xml
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: code/rabbitmq/global.json
      - name: Build the C# and Java examples
        run: bash check.sh build
