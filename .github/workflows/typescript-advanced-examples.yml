# Advanced TypeScript course: type-check every example, solution and type test with tsc, run them with Node.js on
# three OSes, check each error snippet with tsc, measure the validation bundles, and run the C# and Java comparisons
name: Advanced TypeScript course examples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['code/typescript-advanced/**', '.github/workflows/typescript-advanced-examples.yml']
  pull_request:
    paths: ['code/typescript-advanced/**', '.github/workflows/typescript-advanced-examples.yml']

permissions:
  contents: read

env:
  NODE_VERSION: 24.21.0

jobs:
  typescript:
    name: typescript (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: code/typescript-advanced
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Toolchain
        run: node --version && npm --version && dotnet --version && java --version
      # esbuild and Vite also read the site's tsconfig.json at the root of the repository, which extends
      # astro/tsconfigs/strict: install the site's packages so that it resolves as it does on the author's machine
      - name: Install the site's packages, for the root tsconfig.json
        working-directory: .
        run: npm ci --ignore-scripts
      - name: Install the pinned TypeScript, @types/node, Zod, Valibot, ArkType and esbuild
        run: npm ci
      - name: Examples, errors, solutions and comparisons
        env:
          REQUIRE_COMPARE: '1'
        run: bash check.sh
