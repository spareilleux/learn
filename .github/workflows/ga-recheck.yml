# Regression check of GA against the course findings: run code/music-theory-ga/recheck/probe.cs
# against GA's current main and compare with results.txt. A finding that comes back, or a fix that
# changes an answer, makes this job fail; update results.txt (and the journals) when the change is right.
name: GA recheck

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths: ['code/music-theory-ga/recheck/**', '.github/workflows/ga-recheck.yml']
  pull_request:
    paths: ['code/music-theory-ga/recheck/**', '.github/workflows/ga-recheck.yml']

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Clone GA main
        run: |
          git clone --depth 1 https://github.com/GuitarAlchemist/ga.git code/music-theory-ga/.ga-main
          git -C code/music-theory-ga/.ga-main log -1 --format='GA main at %h (%cs): %s'
      # Built apart: the build's warnings go to standard output and would land in the comparison
      - name: Build the probe
        working-directory: code/music-theory-ga/recheck
        run: dotnet build probe.cs
      - name: Run the probe
        working-directory: code/music-theory-ga/recheck
        run: dotnet run --no-build probe.cs > results.actual
      - name: Compare with results.txt
        working-directory: code/music-theory-ga/recheck
        run: diff -u results.txt results.actual
