# LadybugDB course: run the Cypher of every lesson with the LadybugDB CLI on three OSes and compare the output
# (lesson 7 with the 0.19.1 CLI, whose algo and fts extensions load),
# the database files of lesson 8, the C# program of lesson 5 with the NuGet package, the Java programs of lessons 6 and 8 with the Maven package,
# and the SQL cross-checks with the DuckDB CLI
name: LadybugDB course examples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['code/ladybugdb/**', 'code/duckdb/data/**', '.github/workflows/ladybugdb-examples.yml']
  pull_request:
    paths: ['code/ladybugdb/**', 'code/duckdb/data/**', '.github/workflows/ladybugdb-examples.yml']

permissions:
  contents: read

env:
  LBUG_VERSION: 0.20.4
  LBUG19_VERSION: 0.19.1
  DUCKDB_VERSION: 1.5.5

jobs:
  cypher:
    name: cypher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: lbug_cli-linux-x86_64.tar.gz
            duckdb: duckdb_cli-linux-amd64.zip
          - os: windows-latest
            asset: lbug_cli-windows-x86_64.zip
            duckdb: duckdb_cli-windows-amd64.zip
          - os: macos-latest
            asset: lbug_cli-osx-arm64.tar.gz
            duckdb: duckdb_cli-osx-universal.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install the LadybugDB CLI
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$ASSET" "https://github.com/LadybugDB/ladybug/releases/download/v$LBUG_VERSION/$ASSET"
          mkdir -p "$RUNNER_TEMP/lbug"
          case "$ASSET" in
            *.zip) unzip -q "$RUNNER_TEMP/$ASSET" -d "$RUNNER_TEMP/lbug" ;;
            *) tar -xzf "$RUNNER_TEMP/$ASSET" -C "$RUNNER_TEMP/lbug" ;;
          esac
          ls -R "$RUNNER_TEMP/lbug"
          echo "$RUNNER_TEMP/lbug" >> "$GITHUB_PATH"
      - name: Install the LadybugDB 0.19.1 CLI as lbug19, for the algo and fts extensions of lesson 7
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/19-$ASSET" "https://github.com/LadybugDB/ladybug/releases/download/v$LBUG19_VERSION/$ASSET"
          mkdir -p "$RUNNER_TEMP/lbug19"
          case "$ASSET" in
            *.zip) unzip -q "$RUNNER_TEMP/19-$ASSET" -d "$RUNNER_TEMP/lbug19" && mv "$RUNNER_TEMP/lbug19/lbug.exe" "$RUNNER_TEMP/lbug19/lbug19.exe" ;;
            *) tar -xzf "$RUNNER_TEMP/19-$ASSET" -C "$RUNNER_TEMP/lbug19" && mv "$RUNNER_TEMP/lbug19/lbug" "$RUNNER_TEMP/lbug19/lbug19" ;;
          esac
          ls -R "$RUNNER_TEMP/lbug19"
          echo "$RUNNER_TEMP/lbug19" >> "$GITHUB_PATH"
      - name: Install the DuckDB CLI, for the SQL cross-checks
        env:
          ASSET: ${{ matrix.duckdb }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$ASSET" "https://github.com/duckdb/duckdb/releases/download/v$DUCKDB_VERSION/$ASSET"
          mkdir -p "$RUNNER_TEMP/duckdb"
          unzip -q "$RUNNER_TEMP/$ASSET" -d "$RUNNER_TEMP/duckdb"
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"
      - run: bash code/ladybugdb/check.sh

  csharp:
    name: csharp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: lbug_cli-linux-x86_64.tar.gz
          - os: windows-latest
            asset: lbug_cli-windows-x86_64.zip
          - os: macos-latest
            asset: lbug_cli-osx-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: code/ladybugdb/csharp/global.json
      - name: Install the LadybugDB CLI, to share a database file with the NuGet package
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$ASSET" "https://github.com/LadybugDB/ladybug/releases/download/v$LBUG_VERSION/$ASSET"
          mkdir -p "$RUNNER_TEMP/lbug"
          case "$ASSET" in
            *.zip) unzip -q "$RUNNER_TEMP/$ASSET" -d "$RUNNER_TEMP/lbug" ;;
            *) tar -xzf "$RUNNER_TEMP/$ASSET" -C "$RUNNER_TEMP/lbug" ;;
          esac
          echo "$RUNNER_TEMP/lbug" >> "$GITHUB_PATH"
      - run: bash code/ladybugdb/csharp/check.sh

  java:
    name: java (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: lbug_cli-linux-x86_64.tar.gz
          - os: windows-latest
            asset: lbug_cli-windows-x86_64.zip
          - os: macos-latest
            asset: lbug_cli-osx-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: code/ladybugdb/java/pom.xml
      - name: Install the LadybugDB CLI, to share a database file with the Maven package
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$ASSET" "https://github.com/LadybugDB/ladybug/releases/download/v$LBUG_VERSION/$ASSET"
          mkdir -p "$RUNNER_TEMP/lbug"
          case "$ASSET" in
            *.zip) unzip -q "$RUNNER_TEMP/$ASSET" -d "$RUNNER_TEMP/lbug" ;;
            *) tar -xzf "$RUNNER_TEMP/$ASSET" -C "$RUNNER_TEMP/lbug" ;;
          esac
          echo "$RUNNER_TEMP/lbug" >> "$GITHUB_PATH"
      - run: bash code/ladybugdb/java/check.sh
