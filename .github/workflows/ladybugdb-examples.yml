# LadybugDB course: run the Cypher of every lesson with the LadybugDB CLI on three OSes and compare the output,
# and the SQL cross-checks with the DuckDB CLI
name: LadybugDB course examples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['code/ladybugdb/**', 'code/duckdb/data/**', '.github/workflows/ladybugdb-examples.yml']
  pull_request:
    paths: ['code/ladybugdb/**', 'code/duckdb/data/**', '.github/workflows/ladybugdb-examples.yml']

permissions:
  contents: read

env:
  LBUG_VERSION: 0.20.4
  DUCKDB_VERSION: 1.5.5

jobs:
  cypher:
    name: cypher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: lbug_cli-linux-x86_64.tar.gz
            duckdb: duckdb_cli-linux-amd64.zip
          - os: windows-latest
            asset: lbug_cli-windows-x86_64.zip
            duckdb: duckdb_cli-windows-amd64.zip
          - os: macos-latest
            asset: lbug_cli-osx-arm64.tar.gz
            duckdb: duckdb_cli-osx-universal.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install the LadybugDB CLI
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$ASSET" "https://github.com/LadybugDB/ladybug/releases/download/v$LBUG_VERSION/$ASSET"
          mkdir -p "$RUNNER_TEMP/lbug"
          case "$ASSET" in
            *.zip) unzip -q "$RUNNER_TEMP/$ASSET" -d "$RUNNER_TEMP/lbug" ;;
            *) tar -xzf "$RUNNER_TEMP/$ASSET" -C "$RUNNER_TEMP/lbug" ;;
          esac
          ls -R "$RUNNER_TEMP/lbug"
          echo "$RUNNER_TEMP/lbug" >> "$GITHUB_PATH"
      - name: Install the DuckDB CLI, for the SQL cross-checks
        env:
          ASSET: ${{ matrix.duckdb }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$ASSET" "https://github.com/duckdb/duckdb/releases/download/v$DUCKDB_VERSION/$ASSET"
          mkdir -p "$RUNNER_TEMP/duckdb"
          unzip -q "$RUNNER_TEMP/$ASSET" -d "$RUNNER_TEMP/duckdb"
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"
      - run: bash code/ladybugdb/check.sh
