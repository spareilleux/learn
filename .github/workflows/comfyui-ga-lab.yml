# ComfyUI course, Guitar Alchemist lab: the batch runner, the measures and the experiment files, without a GPU.
# unit: the runner against a fake server, the dot detector on synthetic necks, the experiment files, and every
# workflow's nodes and inputs read from ComfyUI's source, on three OSes.
# server: on Ubuntu, a real ComfyUI v0.36.0 on the CPU with the GA node pack: the workflows against /object_info, and
# the runner on a fixture that needs no model. The lab's experiments themselves need SDXL and a GPU: they run on the
# author's machine.
# audit: lesson 11's offline custom node audit and the GA node pack's pixel tests (images made with Pillow 12.1.1).
name: ComfyUI GA lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['code/comfyui/ga-lab/**', 'code/comfyui/custom-nodes/ga/**', 'code/comfyui/custom-nodes/audit/**', '.github/workflows/comfyui-ga-lab.yml']
  pull_request:
    paths: ['code/comfyui/ga-lab/**', 'code/comfyui/custom-nodes/ga/**', 'code/comfyui/custom-nodes/audit/**', '.github/workflows/comfyui-ga-lab.yml']

permissions:
  contents: read

env:
  COMFYUI_TAG: v0.36.0
  COMFYUI_COMMIT: ee71d5c4993f29086b27fde1629a945ae48425bf

jobs:
  audit:
    name: custom-nodes audit and GA pack tests (${{ matrix.os }})
    strategy: {fail-fast: false, matrix: {os: [ubuntu-latest, windows-latest, macos-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - run: python -m pip install --quiet numpy==2.4.2 pillow==12.1.1
      - run: python -m unittest discover -s code/comfyui/custom-nodes/audit/tests -v
      - run: python -m unittest discover -s code/comfyui/custom-nodes/ga/tests -v

  unit:
    name: ga-lab unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: ComfyUI source at its release tag (read, not run)
        run: |
          git clone --depth 1 --branch "$COMFYUI_TAG" https://github.com/Comfy-Org/ComfyUI.git "$RUNNER_TEMP/ComfyUI"
          test "$(git -C "$RUNNER_TEMP/ComfyUI" rev-parse HEAD)" = "$COMFYUI_COMMIT"
      - name: Python packages
        run: python -m pip install --quiet pillow==12.1.1 numpy==2.4.2 pyyaml==6.0.3
      - name: Unit tests
        run: COMFYUI_DIR="$RUNNER_TEMP/ComfyUI" bash code/comfyui/ga-lab/check.sh unit

  server:
    name: ga-lab against ComfyUI on the CPU
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: ComfyUI at its release tag
        run: |
          git clone --depth 1 --branch "$COMFYUI_TAG" https://github.com/Comfy-Org/ComfyUI.git "$RUNNER_TEMP/ComfyUI"
          test "$(git -C "$RUNNER_TEMP/ComfyUI" rev-parse HEAD)" = "$COMFYUI_COMMIT"
      - name: Python packages
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          "$py" -m pip install --quiet torch==2.13.0 torchvision==0.28.0 torchaudio --index-url https://download.pytorch.org/whl/cpu
          "$py" -m pip install --quiet -r "$RUNNER_TEMP/ComfyUI/requirements.txt"
          "$py" -m pip install --quiet pillow==12.1.1 numpy==2.4.2 pyyaml==6.0.3
          echo "COMFYUI_PYTHON=$py" >> "$GITHUB_ENV"
          echo "COMFYUI_DIR=$RUNNER_TEMP/ComfyUI" >> "$GITHUB_ENV"
      - name: Workflows against /object_info, and the runner on a no-model fixture
        run: bash code/comfyui/ga-lab/check.sh server
      - name: Server log
        if: failure()
        run: cat code/comfyui/ga-lab/out/ci-base/server.log || true
