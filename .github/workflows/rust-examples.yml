name: Rust course examples

on:
  push:
    branches: [main]
    paths: ['code/**', '.github/workflows/rust-examples.yml']
  pull_request:
    paths: ['code/**', '.github/workflows/rust-examples.yml']
  workflow_dispatch:

jobs:
  rust-for-csharp-java:
    name: rust-for-csharp-java (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: code/rust-for-csharp-java
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup show active-toolchain && cargo --version
      # Lesson 1 shows these outputs for each OS
      - name: Hello world (lesson 1 outputs)
        working-directory: ${{ runner.temp }}
        run: |
          cargo new hello
          cd hello
          cargo run
          cargo build --release
          ls -l target/release
      - name: Formatting
        run: |
          for dir in . l10-workspace l14-testing l15-ffi; do
            (cd "$dir" && cargo fmt --check)
          done
      - name: Compile-fail doctests
        run: cargo test --doc
      # Stable rustdoc only checks that compile_fail snippets fail; nightly also checks the E0xxx code.
      - name: Compile-fail error codes (nightly)
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly test --doc
      - name: Clippy
        run: cargo clippy --examples -- -D warnings
      - name: Run examples
        run: for ex in examples/*.rs; do cargo run --quiet --example "$(basename "$ex" .rs)"; done
      - name: Lesson 10 workspace
        working-directory: code/rust-for-csharp-java/l10-workspace
        run: |
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo run --quiet -p app
      - name: Lesson 14 crate
        working-directory: code/rust-for-csharp-java/l14-testing
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo test -- --ignored
          cargo doc --no-deps
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Lesson 15 FFI (Rust library called from C#)
        working-directory: code/rust-for-csharp-java/l15-ffi
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release
          ls target/release | grep pricing_ffi
          dotnet run --project dotnet

  # Lessons 16 to 21: the Tauri chord explorer, a separate workspace with its own lock files
  tauri-chord-explorer:
    name: l16-tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: code/rust-for-csharp-java/l16-tauri
    steps:
      - uses: actions/checkout@v7
      # The Debian/Ubuntu list from https://v2.tauri.app/start/prerequisites/
      - name: Webview and system libraries (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Tauri CLI from package-lock.json
        run: npm ci && npx tauri --version
      - name: Toolchain
        run: rustup show active-toolchain && cargo --version
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # theory needs no webview; the chord-explorer tests use Tauri's mock runtime, so no display either
      - name: Tests, IPC tests and compile_fail doctests
        run: cargo test --workspace --locked
      - name: Release build without installers
        run: |
          npx tauri build --no-bundle
          ls -l target/release | grep chord-explorer
