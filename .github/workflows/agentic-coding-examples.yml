# Agentic coding course: the hook, the MCP server and the config files, tested without an API key or an agent, on three OSes
name: Agentic coding course examples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['code/agentic-coding/**', 'src/content/docs/duckdb/**', '.github/workflows/agentic-coding-examples.yml']
  pull_request:
    paths: ['code/agentic-coding/**', 'src/content/docs/duckdb/**', '.github/workflows/agentic-coding-examples.yml']

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: code/agentic-coding/global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: bash code/agentic-coding/check.sh
