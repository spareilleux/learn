# Guitar Alchemist Lab prototypes. P1, the voicing space explorer: unit tests (PCA determinism, the data file round trip,
# exact neighbours, the diagram's string order), the build step on a tiny generated OPTK index, the Vite build, a headless
# Chromium smoke test of the page on that data, and the size budget of the published lab. No GPU timings: the runners
# have no GPU. Other prototypes add their own job.
name: GA Lab prototypes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['code/ga-protos/**', 'public/ga-lab/**', '.github/workflows/ga-protos-examples.yml']
  pull_request:
    paths: ['code/ga-protos/**', 'public/ga-lab/**', '.github/workflows/ga-protos-examples.yml']

permissions:
  contents: read

env:
  NODE_VERSION: 24.21.0

jobs:
  p1-voicing-explorer:
    name: P1 voicing explorer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: code/ga-protos/p1-voicing-explorer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the pinned three.js, Vite and Playwright
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build step on a tiny fixture index
        run: |
          node scripts/make-fixture.mjs
          node scripts/build-data.mjs --index fixture/optick.index --out public/data --sample 200 --k 10 --ga-sha fixture
          node -e "const m=require('./public/data/manifest.json'); if (m.count!==200||m.k!==10||m.checks.midiMismatches!==0) { console.error(m); process.exit(1) }"
      - name: Vite build
        run: node scripts/publish.mjs --out dist
      - name: Chromium for Playwright
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: The page loads the fixture data and renders, whatever backend the runner has
        run: |
          node scripts/probe.mjs --frames 5 | tee probe.txt
          node -e "const l=require('fs').readFileSync('probe.txt','utf8').trim().split('\n'); if (l.some(x=>x.startsWith('pageerror'))) process.exit(1); const r=JSON.parse(l.at(-1)); console.log(r.backend, r.points, 'points'); if (r.points!==200) process.exit(1)"
      - name: The committed build in public/ga-lab/p1 loads under /learn/ with its 30,000 voicings
        run: node scripts/check-published.mjs
      - name: The published lab stays under 20 MB
        working-directory: public/ga-lab
        run: |
          bytes=$(find . -type f -exec cat {} + | wc -c)
          echo "public/ga-lab: $bytes bytes"
          test "$bytes" -le 20000000


  # P2, play a chord, see the universe: unit tests of the DSP, the corpus evaluation compared with the committed
  # figures (accuracies and confusion matrix must match exactly; timings are not compared), the type check and the
  # Vite build, and one headless Chromium run with a fake microphone that reports the backend and the labels found.
  p2-chord-universe:
    name: P2 chord universe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: code/ga-protos/p2-chord-universe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the pinned three.js, Vite, TypeScript and Playwright
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Corpus evaluation, same figures as eval/results.json
        run: node eval/evaluate.ts --check
      - name: Types and Vite build
        run: npm run build
      - name: Chromium for Playwright
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium chromium-headless-shell
      - name: Headless run with a fake microphone (counters only, no timings)
        run: |
          node scripts/fake-mic.ts
          node scripts/browser-run.ts
          node -e "const r=require('./out/browser-run.json'); console.log(r.backend, r.sampleRate, r.frames, 'frames', r.inOrder, 'of', r.expected.length); if (r.error || r.frames < 1 || r.offsite.length) process.exit(1)"


  # P7, the playability model: no GPU and no GA index on the runner. The unit tests, the cost functions checked
  # against the committed scores of the annotated pairs, then a reduced experiment on a dataset the runner
  # generates itself (2,880 voicings of 72 chords, small ensembles, few epochs) whose job is only to prove that
  # the pipeline runs the same everywhere and still beats its trivial baselines. The published figures come from
  # results/measurements.json, not from here. Nothing to install: the prototype is plain Node.js.
  p7-playability:
    name: P7 playability model (${{ matrix.os }})
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: code/ga-protos/p7-playability
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Unit tests
        run: node --test "tests/*.test.mjs"
      - name: The three costs agree with the committed scores of the annotated pairs
        run: node scripts/check-annotations.mjs --out out/annotation-scores.json --check
      - name: A dataset the runner generates itself, with no GA index
        run: |
          node scripts/synth-dataset.mjs --out out/synthetic.jsonl
          node -e "const l=require('fs').readFileSync('out/synthetic.jsonl','utf8').trim().split('\n'); if (l.length < 1000) { console.error(l.length, 'rows'); process.exit(1) } console.log(l.length, 'rows')"
      - name: A reduced experiment on the CPU, under a short budget
        run: node scripts/train.mjs --data out/synthetic.jsonl --out out/ci-measurements.json --budget ci
      - name: The models still beat their baselines, and the run stays inside its budget
        run: node scripts/check-ci-run.mjs --run out/ci-measurements.json


  # P5, 3D-printable bracelets: no printer and no slicer on the runners, so this checks everything that can be checked
  # without one. The pitch classes are re-read from the committed copy of GA's catalog and compared with prototype 2's
  # port; the meshes are rebuilt with trimesh and manifold3d and compared with the figures the lesson quotes, including
  # the two failures it publishes; and the keel's three shapes are measured again. The .stl and .3mf files live outside
  # the repository, so nothing kept here is written by a run. PrusaSlicer's grams and minutes come from the author's
  # machine and are not re-run here.
  p5-printable-bracelets:
    name: P5 printable bracelets (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: code/ga-protos/p5-printable-bracelets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: The pitch classes are still GA's, and still agree with prototype 2
        run: |
          node scripts/ga-sets.ts
          node --test "tests/*.test.ts"
      - name: Install trimesh, manifold3d and the rest, pinned
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Unit tests, including the bore, the walls and the overhangs
        run: python -m unittest discover -s tests -t . -v
      - name: The same meshes come out here as on the author's machine, failures included
        run: python mesh/check_ci.py --results results/measurements.json
      - name: The keel's three shapes, measured again
        run: |
          python mesh/keel_sweep.py --results "$RUNNER_TEMP/keel-sweep.json" > /dev/null
          python mesh/check_ci.py --keel results/keel-sweep.json "$RUNNER_TEMP/keel-sweep.json"
      - name: One bracelet exported to a temporary folder, and small enough to send anywhere
        run: |
          python mesh/run.py --set "C major-triad" --bead cone --out "$RUNNER_TEMP/p5" --results "$RUNNER_TEMP/one.json"
          python mesh/check_ci.py --export "$RUNNER_TEMP/one.json"
      - name: The pictures the lesson shows stay small
        working-directory: src/assets/ga-lab
        run: |
          bytes=$(find . -name 'p5-*' -type f -exec cat {} + | wc -c)
          echo "src/assets/ga-lab, p5 renders: $bytes bytes"
          test "$bytes" -le 2000000
