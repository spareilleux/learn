<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Observatory Web</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>

<script>
/* Observatory: supersampling for the 3D view (artpass/aa/NOTES.md). Godot sizes its canvas by
   window.devicePixelRatio; reporting a larger ratio makes it render finer than the screen, and
   the browser filters the canvas down. 1.5 on computers, 1 on touch screens; ?ss=<factor>
   overrides. If frames then come slower than about 45 per second, it falls back to 1.
   observatory.gd reads window.__obsSS to keep the HUD's size. */
(function () {
  var q = new URLSearchParams(location.search);
  var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  var fixed = q.has('ss');
  var ss = parseFloat(q.get('ss') || (touch ? '1' : '1.5'));
  if (!(ss >= 1 && ss <= 3)) ss = 1;
  window.__obsSS = ss;
  var d = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') || Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
  var get = d && d.get;
  Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: function () { return (get ? get.call(window) : 1) * window.__obsSS; } });
  if (fixed || ss === 1) return;
  // observatory.gd sets __obsRunning once the scene is built; skip 2 s of shader compiles, then
  // take the median frame interval over 90 frames.
  var times = [], last = 0, start = 0;
  function tick(t) {
    if (!window.__obsRunning) { requestAnimationFrame(tick); return; }
    if (!start) start = t;
    if (t - start > 2000) { if (last) times.push(t - last); last = t; }
    if (times.length < 90) { requestAnimationFrame(tick); return; }
    times.sort(function (a, b) { return a - b; });
    window.__obsFrameMedian = times[45];
    if (times[45] > 22) { window.__obsSS = 1; window.dispatchEvent(new Event('resize')); }
  }
  requestAnimationFrame(tick);
})();
</script>
<script>
/* Observatory: MSAA for the 3D view (artpass/motion/NOTES.md). Under Godot's Compatibility
   renderer, the web export's, FXAA and SMAA change no pixel; MSAA is the only anti-aliasing there.
   4x on touch screens, where it cut the visible shimmer by 30 to 43 % in emulation; none on
   computers, where Chrome's ANGLE made it ten times slower and the 1.5x supersampling above does
   the work. Its cost on a real phone is not measured yet: if frames come slower than about 45 a
   second, it steps down to 2x, then off. ?msaa=0|2|4 fixes it.
   observatory.gd applies window.__obsMSAA once a second. */
(function () {
  var q = new URLSearchParams(location.search);
  var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  var fixed = q.has('msaa');
  var m = parseInt(q.get('msaa') || (touch ? '4' : '0'), 10);
  if ([0, 2, 4].indexOf(m) < 0) m = 0;
  window.__obsMSAA = m;
  if (fixed || m === 0) return;
  var times = [], last = 0, start = 0;
  function tick(t) {
    if (!window.__obsRunning || window.__obsMSAA === 0) { if (window.__obsMSAA !== 0) requestAnimationFrame(tick); return; }
    if (!start) start = t;
    // Skip 2 s (shader compiles, or the last change settling), then 90 frames.
    if (t - start > 2000) { if (last) times.push(t - last); last = t; }
    if (times.length < 90) { requestAnimationFrame(tick); return; }
    times.sort(function (a, b) { return a - b; });
    window.__obsMSAAMedian = times[45];
    if (times[45] > 22) {
      window.__obsMSAA = window.__obsMSAA === 4 ? 2 : 0;
      times = []; last = 0; start = 0;
      requestAnimationFrame(tick);
    }
  }
  requestAnimationFrame(tick);
})();
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":21731268,"index.wasm":37685705},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
